schema: spec-driven
change: core-alert-cycle
title: Core Alert Cycle (Local, No Cloud)
created: 2026-09-03
updated: 2026-09-03

artifact_store:
  mode: hybrid
  openspec_root: openspec/changes/core-alert-cycle
  engram_prefix: sdd/core-alert-cycle

execution:
  mode: interactive
  delivery_strategy: ask-on-risk
  strict_tdd: true

# Subproject 1 of the design spec is sliced into three chained changes.
chain:
  position: 1
  of: 3
  next:
    - composer-agent
    - cloud-deployment

phases:
  explore:
    status: skipped
    artifact: null
    note: >-
      No sdd-explore run. Exploration input is the approved design spec
      docs/superpowers/specs/2026-09-03-rain-alert-core-design.md plus
      docs/rain-alert-core-architecture.drawio.
  proposal:
    status: done
    artifact: openspec/changes/core-alert-cycle/proposal.md
    engram_topic_key: sdd/core-alert-cycle/proposal
    engram_saved: true
    note: >-
      Engram half persisted by the orchestrator from proposal.md on
      2026-09-03 (propose executor had no mem_save tool).
  spec:
    status: done
    depends_on: [proposal]
    artifact:
      - openspec/changes/core-alert-cycle/specs/risk-evaluation/spec.md
      - openspec/changes/core-alert-cycle/specs/alert-dedup/spec.md
      - openspec/changes/core-alert-cycle/specs/source-outage-notices/spec.md
      - openspec/changes/core-alert-cycle/specs/weather-sources/spec.md
      - openspec/changes/core-alert-cycle/specs/alert-cycle/spec.md
      - openspec/changes/core-alert-cycle/specs/local-alert-cli/spec.md
      - openspec/changes/core-alert-cycle/specs/repo-hygiene/spec.md
    engram_topic_key: sdd/core-alert-cycle/spec
    engram_saved: true
  design:
    status: done
    depends_on: [proposal]
    artifact: openspec/changes/core-alert-cycle/design.md
    engram_topic_key: sdd/core-alert-cycle/design
    engram_saved: true
    note: >-
      Engram half persisted by the orchestrator from design.md on 2026-09-03.
      Pins the port/type contracts that changes 2 and 3 consume.
  tasks:
    status: done
    depends_on: [spec, design]
    artifact: openspec/changes/core-alert-cycle/tasks.md
    engram_topic_key: sdd/core-alert-cycle/tasks
    engram_saved: true
    note: >-
      43 tasks across 3 phases mapped 1:1 to the design's PR slices. Review
      Workload Forecast: High risk, chained PRs recommended, chain strategy
      pending owner choice. Two design/spec placement ambiguities (AlertPolicy
      shell location, OutageNoticePolicy naming) recorded under "Open Items
      for Apply" rather than resolved.
  apply:
    status: in_progress
    depends_on: [tasks]
    artifact: openspec/changes/core-alert-cycle/apply-progress.md
    engram_topic_key: sdd/core-alert-cycle/apply-progress
    engram_saved: false
    slices:
      - id: 1
        name: tooling-and-hygiene
        branch: feat/core-alert-cycle-1-tooling
        tasks: 1.1-1.5
        status: complete
        review: fresh-context review passed after one CRITICAL fix
          (architecture scanner ignored relative imports, fixed in c06a1a6)
        gate: pytest 10 passed, ruff check, ruff format --check, mypy all exit 0
        size_exception: >-
          Accepted by the owner on 2026-09-04. 324 authored insertions
          (1134 total including LICENSE, uv.lock and planning artifacts)
          against a 250-line cap; ~200 of the 324 are test code.
      - id: 2
        name: domain-ports-use-case
        branch: feat/core-alert-cycle-2-domain
        tasks: 2.1-2.22
        status: apply_complete_review_remediated_pending_pr
        review: >-
          Fresh-context adversarial review run 2026-09-04. Returned 2 CRITICAL,
          6 WARNING and 3 suggestions; all fixed on the same branch under
          strict TDD, plus two owner decisions taken after the review (the
          fifth risk branch and pruning tautological tests). See
          apply-progress.md "Phase 2 Review Remediation (2026-09-04)" for the
          per-finding disposition and evidence.
        gate: >-
          pytest 149 passed, ruff check, ruff format --check, mypy all exit 0
          (re-run after remediation; was 98 passed before it, and 165 before
          the owner-approved pruning of 16 tautological tests)
        line_budget_risk: >-
          High, still unresolved. Diff since main after remediation: 3151
          insertions across 35 src/tests files, against the tasks.md ~400
          (source) / ~800 (with tests) estimate. Pruning 16 tautological tests
          removed some of it; the remediation added structured reasons, a
          boundary table, a monotonicity guard and a new policies test file.
          Still needs an ask-on-risk decision before PR-2 opens: accept
          size:exception, or split further.
        open_items_resolved:
          - AlertPolicy port-bound shell placed in application/policies.py
          - OutageNoticePolicy is naming shorthand for the pure
            evaluate_outage() function; no such class exists
          - "ports/ architecture allow-list extended with \"datetime\" (design
            section 10 listed only typing/collections.abc/rain_alert.domain)"
          - >-
            Owner-approved fifth prepare branch added to the evaluation order
            (design section 5 is now six branches): a healthy but silent
            SENAMHI must never be less sensitive than an unavailable one.
          - >-
            Reasons are structured Reason values with an English operator
            renderer and a Spanish recipient renderer (design section 3.1),
            resolving the alert-cycle / risk-evaluation wording conflict.
          - >-
            OutageRecord.notified_at now has a reader: an unchanged set with
            notified_at None is still owed its notice (design section 6).
        deviations_recorded:
          - >-
            domain/reasons.py is an addition to design section 12's file table,
            recorded in tasks.md Open Items like application/policies.py.
          - >-
            pythonpath = ["."] replaced by tests/__init__.py packages, but a
            probe showed the repo root is on sys.path either way because
            uv run puts the working directory there. Recorded rather than
            implied in apply-progress.md.
      - id: 3
        name: adapters-and-cli
        branch: feat/core-alert-cycle-3-adapters
        tasks: 3.1-3.16 plus 3.5b
        status: apply_complete_review_remediated_pending_pr
        gate: >-
          Re-run after the review remediation on 2026-09-04: pytest 455 passed
          / 15 integration deselected, ruff check, ruff format --check, mypy
          all exit 0. Opt-in suite run separately against the live sources: 10
          passed, 5 skipped (hazard families with no row on today's Lambayeque
          page). Live CLI smoke run clean, exit 0, nothing transmitted, no
          state written — and the new Notes block now shows the RED heat
          warning in force being discarded with its reason.
        review: >-
          Fresh-context adversarial review run 2026-09-04. Returned 2 CRITICAL,
          3 WARNINGs, 3 suggestions and one owner decision; all fixed on the
          same branch under strict TDD. See apply-progress.md "Phase 3 Review
          Remediation (2026-09-04)" for the per-finding disposition and
          evidence.
        contract_change: >-
          Owner-approved multi-hazard filter (design section 5.1). The SENAMHI
          Lambayeque page is a multi-hazard feed, not a rain feed: of 788 rows
          live on 2026-09-04, ~233 wind, ~131 temperature, ~137
          precipitation, and the single warning IN FORCE was a RED daytime
          temperature warning. Branch 1 of the evaluator raises imminent on
          any current orange/red warning, so the first live cycle would have
          announced imminent flooding because of a heat wave. Warnings are now
          filtered by phenomenon before reaching the evaluator. New
          domain/hazards.py and adapters/senamhi_classification.py; Warning
          gained phenomenon and zone. New requirements and scenarios in
          specs/weather-sources/spec.md.
        contract_change_2: >-
          Owner-approved correction to the geography half of the filter, taken
          at the 2026-09-04 review (design section 5.1.1). The coast-only rule
          was too blunt: it dropped 144 of the 243 live precipitation rows,
          and PRECIPITACIONES EN LA SIERRA is the page's most common
          precipitation title at 78 rows. The Rio La Leche rises at 4230 m on
          Mount Choicopico inside Ferrenafe province and flows west through
          the city; SENAMHI gauges its critical level at Puchaca in Incahuasi,
          also inside the province, and attributes rises to intense rain in
          the basin headwaters. Sierra rain is therefore upstream with hours
          of lead time, and is the mechanism behind the 2017 flooding.
          Highlands-only rainfall is flood-relevant again as an EARLY signal:
          it may contribute to prepare and may not raise imminent on its own.
          is_flood_relevant(phenomenon) and may_raise_imminent(phenomenon,
          zone) are now two rules answering two questions. New requirement
          with five scenarios in specs/risk-evaluation/spec.md.
        line_budget_risk: >-
          High, unresolved, flagged not absorbed. Diff since main: 4507
          insertions across 41 files (1739 src, 2639 tests including ~750
          lines of captured fixtures, 129 openspec) against the tasks.md ~450
          estimate. Drivers: the unplanned owner-approved filter (~500 lines
          across source, tests and specs) and recorded fixture data. All eight
          work-unit commits are independently reviewable and revertable, so a
          further chained split is feasible instead of a third size:exception.
        open_items_resolved:
          - >-
            Open-Meteo endpoint path and every query-parameter name in design
            section 8.1 verified live and correct as written.
          - >-
            SENAMHI header labels verified live: Aviso, Nro., Emision, Inicio,
            Fin, Duracion, Nivel. Table located by header signature,
            tolerating duplicate labels.
          - >-
            forecast_days is 4, not 2 and not 3. Two days does return 48
            points, but they start at today 00:00 UTC, so any run after
            midnight has fewer than 48 forward hours. Three clears 48 forward
            hours but leaves only one spare hour at 23:00 UTC, so clock skew
            or a late publication drops the cycle to insufficient_horizon.
            Raised to 4 at the 2026-09-04 review (W4); it costs nothing and
            the forward slice never reads the extra day.
          - >-
            An anomaly on the row marked (vigente) is a structural failure,
            not a skippable row. The share guard cannot see it: one bad row of
            789 is 0.13 percent, so a single unparseable cell produced
            available with an empty tuple while a red aviso was in force, and
            the resulting available status routed the evaluator to the
            stricter forecast-only threshold. Design section 5.1.2, new
            requirement in specs/weather-sources/spec.md.
          - >-
            Phenomenon markers are word-boundary patterns, not fixed phrases.
            SENAMHI publishes the same aviso family with and without the
            article, and INCREMENTO DE LA TEMPERATURA DIURNA is not a
            substring of INCREMENTO DE TEMPERATURA, so the article variant
            classified as UNKNOWN, which the filter treats as flood-relevant.
            56 rows across 9 of the 12 regional pages used the article form.
            All 12399 harvested titles now classify into a named family.
          - >-
            Warnings currently in force are identified by the (vigente) marker
            cross-checked against the row start/end dates; the marker alone is
            not trusted.
        deviations_recorded:
          - >-
            adapters/serialization.py and adapters/local/offline_sources.py are
            additions to design section 12's file table, recorded in tasks.md
            Open Items like domain/reasons.py before them.
          - >-
            Five SENAMHI fixtures instead of the four task 3.3 named. The real
            capture's only in-force row is a heat warning, so
            precipitation_coast_current.html was added to exercise the positive
            path; its one synthetic row is labelled as such in the file header
            and in the fixtures README.
          - >-
            RESOLVED at the 2026-09-04 review. The discard audit is surfaced
            by the CLI after all. The premise that the port could not carry it
            was wrong: Available is a plain frozen dataclass, so adding
            notes tuple[str, ...] = () is purely additive, breaks no merged
            call site and keeps mypy strict green. Discard reasons and a
            parse-anomaly summary now reach the CLI Notes block and --json.
          - >-
            tests/support/fakes.FakeAlertRepository composes
            InMemoryAlertRepository instead of reimplementing the window-start
            query, and the port-contract test runs against it too. The third
            copy had already diverged: clear_active_outage ignored city_slug.
        open_items_carried:
          - >-
            The zone rule accepts any mention of COSTA, including COSTA SUR
            (1 row of 789). With highlands-only rainfall now kept, the zone
            can only limit severity and never removes a warning, so this is a
            calibration question rather than a way to miss one.
          - >-
            JsonFileAlertRepository.alerts grows without bound and the whole
            document is rewritten on every send. Not urgent — one send per
            six-hour cycle, only on an escalation, gitignored and disposable.
            Proposed retention rule recorded in tasks.md Open Items and in a
            comment next to the code; deliberately not implemented, because it
            needs a clock the port does not carry and change 3's DynamoDB
            adapter wants a TTL attribute rather than a rewrite.
    note: >-
      All three slices implemented as of 2026-09-04. Slice 3 (adapters, local
      repositories, CLI) is complete on feat/core-alert-cycle-3-adapters with
      the gate green and a clean live smoke run, and carries one
      owner-approved contract change to the SENAMHI warning filter. PR-3 is
      not open: fresh-context review and the line-budget decision are
      outstanding, and no push or PR was made by this apply run.
      Slice 1 of 3 complete on branch feat/core-alert-cycle-1-tooling
      (chain strategy stacked-to-main, so PR-1 targets main). Slice 2
      (domain, ports, RunAlertCycle) implemented on
      feat/core-alert-cycle-2-domain, all Phase 2 tasks (2.1-2.22) complete,
      fresh-context review run 2026-09-04 and every confirmed finding
      remediated on the same branch with the gate green. PR-2 is not open:
      the line-budget decision is still outstanding, and no push or PR was
      made by the remediation run.
  verify:
    status: done
    depends_on: [apply]
    artifact: openspec/changes/core-alert-cycle/verify-report.md
    engram_topic_key: sdd/core-alert-cycle/verify-report
    engram_saved: false
    verdict: PASS WITH FINDINGS
    verified_on: 2026-09-06
    verified_ref: chore/land-slice3-remainder @ bcba50b
    gate: >-
      uv run pytest 537 passed / 15 deselected; uv run ruff check . clean;
      uv run ruff format --check . 78 files; uv run mypy clean on 35 source
      files. All exit 0. Live CLI run clean, exit 0, nothing transmitted, both
      hazards in force correctly discarded with stated reasons. The opt-in
      integration suite needed three attempts: runs 1 and 2 failed on transient
      TLS connect timeouts to the live sources, run 3 passed 10 / 5 skipped.
    coverage: >-
      35 requirements and 64 scenarios traced across the seven spec files.
      34 of 35 requirements proven by a test that ran green; 63 of 64 scenarios
      have a covering test. The uncovered scenario is repo-hygiene
      "Grep check passes", which has no automated test — the property itself was
      re-verified by hand during this run and is clean.
    findings:
      critical: 0
      warning: 8
      suggestion: 11
    blocking: none
    key_findings:
      - >-
        W1 MessageRequest.warning can name a warning the evaluator refused to
        act on (_most_severe_warning ignores may_raise_imminent), and the field
        has zero test coverage. Latent contract defect for change 2's composer;
        no user-visible impact today because the template does not render it.
      - >-
        W2 The "in order" and "record only after notify" guarantees in
        alert-cycle are unasserted, and tests/support/fakes.py has no shared
        call log, so cross-port ordering is not observable at all.
      - >-
        W3 repo-hygiene "Grep check passes" is the only spec scenario with no
        automated test. Verified manually and clean; no regression guard exists
        on a public repository.
      - >-
        W4 The --json document's evaluated_at is the assessment window start,
        not the cycle clock. Reproduced: a run at 2026-09-05T12:00Z reported
        2026-09-04T05:00Z. The document carries no record of when the cycle ran.
      - >-
        W5 tasks.md still states forecast_days=3 at lines 67 and 91; code,
        design section 8.1 and the architecture guide all say 4.
      - >-
        W5b domain/sanitize.py and the MessageComposer sanitization invariant
        are not recorded in design.md; the module docstring cites section 3.2,
        which is about forecast horizons.
      - >-
        W6 This state.yaml does not describe the shipped system: apply is still
        in_progress, slices 2 and 3 say "PR not open / no push was made",
        next_recommended is sdd-apply, and the 2026-09-05 security remediation
        has no entry at all. The archive record is built from this file.
      - >-
        W7 risk-evaluation requires the evaluator to read coordinates from
        configuration; RiskEvaluator only ever receives RiskThresholds. Spec
        sentence broader than its own scenario and than anything the code can
        satisfy.
      - >-
        W8 alert-cycle says the template must include "each reason"; the
        template deliberately suppresses SenamhiUnavailableReason's line per
        design section 3.1. The spec sentence was never amended.
    note: >-
      No source file was modified by this phase. Only verify-report.md and this
      block were written. Findings W5, W5b and W6 are artifact-accuracy issues
      and should be corrected before sdd-archive, because the archive record is
      assembled from these artifacts.
  archive:
    status: pending
    depends_on: [verify]
    artifact: null

next_recommended:
  - sdd-apply

blocked_reasons: []

resolved_decisions:
  - id: threshold-contradiction
    resolved: 2026-09-03
    decision: >-
      The Prepare rule (>= 9.5 mm accumulated in 48 h, Reque p95 boundary)
      governs. The named scenario was corrected to 10 mm -> prepare and a
      boundary scenario 9 mm -> none was added. Design spec 6.3 and
      proposal.md success criteria updated.

open_decisions:
  - id: ferrenafe-coordinates
    owner: sdd-spec
    detail: >-
      Exact latitude/longitude for Ferrenafe is an open item in design spec
      section 12. A documented placeholder may be used in the local config
      fake for this change.
