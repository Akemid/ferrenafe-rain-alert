            uv run puts the working directory there. Recorded rather than
            implied in apply-progress.md.
      - id: 3
        name: adapters-and-cli
        branch: feat/core-alert-cycle-3-adapters
        tasks: 3.1-3.16 plus 3.5b
        status: merged
        pull_requests:
          # The line-budget decision below was resolved by splitting rather
          # than by a third size:exception: slice 3 shipped as a chain of
          # three PRs plus a fourth carrying the guide and the security fixes.
          - number: 3
            title: "feat: acquire and classify the live weather sources (slice 3a of 3)"
            head: feat/core-alert-cycle-3a-sources
            base: main
            merged_at: 2026-09-05T16:55:08Z
          - number: 4
            title: "feat: add the console notifier and local persistence (slice 3b of 3)"
            head: feat/core-alert-cycle-3b-persistence
            base: feat/core-alert-cycle-3a-sources
            merged_at: 2026-09-05T17:05:09Z
          - number: 5
            title: "feat: add the local alert-cycle CLI and live canaries (slice 3c of 3)"
            head: feat/core-alert-cycle-3c-cli
            base: feat/core-alert-cycle-3b-persistence
            merged_at: 2026-09-05T17:05:58Z
          - number: 6
            title: >-
              docs: add the architecture guide, fix the first security review,
              land the remaining slice-3 commits
            head: feat/core-alert-cycle-3c-cli
            base: main
            merged_at: 2026-09-06T03:19:31Z
            carries: >-
              The docs/architecture/ guide, the 2026-09-05 security review
              remediation (see the security_remediation slice below) and the
              slice-3 commits left over after the 3a/3b/3c chain.
        gate: >-
          Re-run after the review remediation on 2026-09-04: pytest 455 passed
          / 15 integration deselected, ruff check, ruff format --check, mypy
          all exit 0. Opt-in suite run separately against the live sources: 10
          passed, 5 skipped (hazard families with no row on today's Lambayeque
          page). Live CLI smoke run clean, exit 0, nothing transmitted, no
          state written — and the new Notes block now shows the RED heat
          warning in force being discarded with its reason.
        review: >-
          Fresh-context adversarial review run 2026-09-04. Returned 2 CRITICAL,
          3 WARNINGs, 3 suggestions and one owner decision; all fixed on the
          same branch under strict TDD. See apply-progress.md "Phase 3 Review
          Remediation (2026-09-04)" for the per-finding disposition and
          evidence.
        contract_change: >-
          Owner-approved multi-hazard filter (design section 5.1). The SENAMHI
          Lambayeque page is a multi-hazard feed, not a rain feed: of 788 rows
          live on 2026-09-04, ~233 wind, ~131 temperature, ~137
          precipitation, and the single warning IN FORCE was a RED daytime
          temperature warning. Branch 1 of the evaluator raises imminent on
          any current orange/red warning, so the first live cycle would have
          announced imminent flooding because of a heat wave. Warnings are now
          filtered by phenomenon before reaching the evaluator. New
          domain/hazards.py and adapters/senamhi_classification.py; Warning
          gained phenomenon and zone. New requirements and scenarios in
          specs/weather-sources/spec.md.
        contract_change_2: >-
          Owner-approved correction to the geography half of the filter, taken
          at the 2026-09-04 review (design section 5.1.1). The coast-only rule
          was too blunt: it dropped 144 of the 243 live precipitation rows,
          and PRECIPITACIONES EN LA SIERRA is the page's most common
          precipitation title at 78 rows. The Rio La Leche rises at 4230 m on
          Mount Choicopico inside Ferrenafe province and flows west through
          the city; SENAMHI gauges its critical level at Puchaca in Incahuasi,
          also inside the province, and attributes rises to intense rain in
          the basin headwaters. Sierra rain is therefore upstream with hours
          of lead time, and is the mechanism behind the 2017 flooding.
          Highlands-only rainfall is flood-relevant again as an EARLY signal:
          it may contribute to prepare and may not raise imminent on its own.
          is_flood_relevant(phenomenon) and may_raise_imminent(phenomenon,
          zone) are now two rules answering two questions. New requirement
          with five scenarios in specs/risk-evaluation/spec.md.
        line_budget_risk: >-
          High, resolved by splitting rather than by a third size:exception.
          Diff since main was 4507 insertions across 41 files (1739 src, 2639
          tests including ~750 lines of captured fixtures, 129 openspec)
          against the tasks.md ~450 estimate. Drivers: the unplanned
          owner-approved filter (~500 lines across source, tests and specs) and
          recorded fixture data. The work-unit commits were independently
          reviewable, so the slice shipped as the 3a/3b/3c chain (PRs 3, 4, 5)
          plus PR 6. Individual PRs were still over budget; the overrun is
          recorded in tasks.md as accepted and not retroactively fixable.
        open_items_resolved:
          - >-
            Open-Meteo endpoint path and every query-parameter name in design
            section 8.1 verified live and correct as written.
          - >-
            SENAMHI header labels verified live: Aviso, Nro., Emision, Inicio,
            Fin, Duracion, Nivel. Table located by header signature,
            tolerating duplicate labels.
          - >-
            forecast_days is 4, not 2 and not 3. Two days does return 48
            points, but they start at today 00:00 UTC, so any run after
            midnight has fewer than 48 forward hours. Three clears 48 forward
            hours but leaves only one spare hour at 23:00 UTC, so clock skew
            or a late publication drops the cycle to insufficient_horizon.
            Raised to 4 at the 2026-09-04 review (W4); it costs nothing and
            the forward slice never reads the extra day.
          - >-
            An anomaly on the row marked (vigente) is a structural failure,
            not a skippable row. The share guard cannot see it: one bad row of
            789 is 0.13 percent, so a single unparseable cell produced
            available with an empty tuple while a red aviso was in force, and
            the resulting available status routed the evaluator to the
            stricter forecast-only threshold. Design section 5.1.2, new
            requirement in specs/weather-sources/spec.md.
          - >-
            Phenomenon markers are word-boundary patterns, not fixed phrases.
            SENAMHI publishes the same aviso family with and without the
            article, and INCREMENTO DE LA TEMPERATURA DIURNA is not a
            substring of INCREMENTO DE TEMPERATURA, so the article variant
            classified as UNKNOWN, which the filter treats as flood-relevant.
            56 rows across 9 of the 12 regional pages used the article form.
            All 12399 harvested titles now classify into a named family.
          - >-
            Warnings currently in force are identified by the (vigente) marker
            cross-checked against the row start/end dates; the marker alone is
            not trusted.
        deviations_recorded:
          - >-
            adapters/serialization.py and adapters/local/offline_sources.py are
            additions to design section 12's file table, recorded in tasks.md
            Open Items like domain/reasons.py before them.
          - >-
            Five SENAMHI fixtures instead of the four task 3.3 named. The real
            capture's only in-force row is a heat warning, so
            precipitation_coast_current.html was added to exercise the positive
            path; its one synthetic row is labelled as such in the file header
            and in the fixtures README.
          - >-
            RESOLVED at the 2026-09-04 review. The discard audit is surfaced
            by the CLI after all. The premise that the port could not carry it
            was wrong: Available is a plain frozen dataclass, so adding
            notes tuple[str, ...] = () is purely additive, breaks no merged
            call site and keeps mypy strict green. Discard reasons and a
            parse-anomaly summary now reach the CLI Notes block and --json.
          - >-
            tests/support/fakes.FakeAlertRepository composes
            InMemoryAlertRepository instead of reimplementing the window-start
            query, and the port-contract test runs against it too. The third
            copy had already diverged: clear_active_outage ignored city_slug.
        open_items_carried:
          - >-
            The zone rule accepts any mention of COSTA, including COSTA SUR
            (1 row of 789). With highlands-only rainfall now kept, the zone
            can only limit severity and never removes a warning, so this is a
            calibration question rather than a way to miss one.
          - >-
            JsonFileAlertRepository.alerts grows without bound and the whole
            document is rewritten on every send. Not urgent — one send per
            six-hour cycle, only on an escalation, gitignored and disposable.
            Proposed retention rule recorded in tasks.md Open Items and in a
            comment next to the code; deliberately not implemented, because it
            needs a clock the port does not carry and change 3's DynamoDB
            adapter wants a TTL attribute rather than a rewrite.
      - id: security-remediation
        name: security-review-remediation
        date: 2026-09-05
        # Added 2026-09-06 (verify finding W6). This slice produced three
        # source fixes and a new domain module and had no entry at all,
        # although apply-progress.md carried the full record.
        status: merged
        shipped_in_pull_request: 6
        trigger: >-
          Fresh-context security review of the merged slice-3 code, run
          2026-09-05. Returned one HIGH, one MEDIUM and one LOW; all three
          fixed under strict TDD on feat/core-alert-cycle-3c-cli.
        commits:
          - bc25e4a fix(domain) stop a scraped aviso title from forging structure in the message
          - b38ed34 fix(adapters) degrade the cycle on an anomalous forecast value, never abort it
          - f611fce fix(entrypoints) give the --json document standard output to itself
          - bcba50b docs record the security remediation in the guide and the openspec artifacts
        findings:
          - >-
            HIGH. A scraped aviso title could forge structure inside the
            Spanish community body. Reproduced end to end: a title carrying
            newlines produced two Recomendaciones: sections, the forged one
            ahead of the genuine one and formatted identically, plus a live
            ANSI escape and a surviving U+202E override. New domain module
            domain/sanitize.py, applied at all four rendering boundaries; the
            invariant is stated on the MessageComposer port so change 2's
            agent composer inherits it. Recorded in design section 3.3 on
            2026-09-06 (verify finding W5b) — until then it was in tasks.md
            and apply-progress.md only.
          - >-
            MEDIUM. An uncaught ValueError from a malformed forecast value
            aborted the whole cycle. json.loads accepts bare NaN and Infinity;
            Infinity millimetres was the quieter case, parsing as valid and
            clearing imminent_mm_24h unconditionally. Range and finiteness are
            now enforced in the adapter and on HourlyPoint, and both forecast
            providers gained the catch-all the sibling scraper carried.
          - >-
            LOW. The --json document was unparseable whenever the run sent an
            alert or emitted a notice, because ConsoleNotifier shared stdout.
            The notifier now takes a stream and the CLI gives it stderr under
            --json.
        deviations_recorded:
          - >-
            domain/sanitize.py is an addition to design section 12's file
            table. Recorded in tasks.md at the time, and in design sections
            3.3 and 12 on 2026-09-06.
        gate: >-
          pytest 537 passed / 15 deselected, ruff check, ruff format --check,
          mypy clean on 35 source files. All exit 0.
      - id: verification-remediation
        name: verify-findings-remediation
        date: 2026-09-06
        status: implemented_pending_push
        branch: chore/land-slice3-remainder
        trigger: >-
          The sdd-verify findings in verify-report.md (0 CRITICAL, 8 WARNING,
          11 SUGGESTION). Every finding is dispositioned in tasks.md under
          "Added at the 2026-09-06 verification remediation"; fixed items name
          what changed, deferred items name why and what would close them.
        fixed_in_code: [W1, W2, W3, W4, S1, S2, S3b, S4, S5, S6, S6b, S8, S9]
        fixed_in_artifacts: [W5, W5b, W6, W7, W8, S3, S7, S10, S11]
        deferred:
          - >-
            S3 (partial). AlertConfig.forecast_hours does not move the
            evaluation window; the horizons are module constants in
            domain/risk.py. Design section 5 now says so and tasks.md carries
            the open item. Not changed because making the horizons
            configurable means deciding whether a threshold calibrated over
            48 hours still means anything over 72 — a calibration question for
            the first rainy season and an owner decision, not a refactor.
        mutation_evidence: >-
          W2 confirmed in both directions. With AlertRecord construction and
          record_alert moved above send_alert, the two new ordering tests fail
          (assert 9 < 8) and the rest pass; reverted, all pass. Before the
          shared CallLog existed the same mutation left the whole suite green.
        gate: >-
          pytest 549 passed / 15 deselected, ruff check, ruff format --check,
          mypy clean on 35 source files, uv run rain-alert-cycle exit 0 against
          the live sources with both hazards in force correctly discarded.
          The opt-in live suite needed two attempts on the final run: attempt 1
          failed on a transient read timeout in test_open_meteo_live.py
          (1 failed, 9 passed, 5 skipped, 6.89s), attempt 2 was clean
          (10 passed, 5 skipped, 1.95s). The SENAMHI canary passed on both
          attempts, which is what finding S9 addressed; the Open-Meteo live
          test deliberately keeps the production timeout and can still flake.
          Recorded honestly rather than reported as a single green run.
        note: >-
          Not pushed and no PR opened by the remediation run, by instruction;
          the orchestrator owns the push. This is the only apply work in the
          change that is not yet on main.
    note: >-
      Apply is complete and all six pull requests are merged. Slice 1 shipped
      as PR 1 (2026-09-04) and slice 2 as PR 2 (2026-09-04), both to main under
      the stacked-to-main chain strategy with an owner-accepted size:exception
      each. Slice 3 was too large for one PR, so it shipped as the chained
      3a/3b/3c trio (PRs 3, 4 and 5, merged 2026-09-05) plus PR 6 (merged
      2026-09-06), which also carried the docs/architecture/ guide and the
      2026-09-05 security review remediation. The 2026-09-06 verification
      remediation is implemented on chore/land-slice3-remainder and is the one
      piece not yet on main.
      This note said apply was in progress, that PR-2 and PR-3 were not open
      and that no push had been made, until 2026-09-06 (verify finding W6).
  verify:
    status: done
    depends_on: [apply]
    artifact: openspec/changes/core-alert-cycle/verify-report.md
    engram_topic_key: sdd/core-alert-cycle/verify-report
    engram_saved: false
    verdict: PASS
    verified_on: 2026-09-07
    verified_ref: main @ a2f3af8 (a2f3af853a9e090eeb0194bf1c671cb936cd55af)
    # Re-verification on main after every remediation was merged. It replaces
    # the 2026-09-06 run, which was taken on the then-unmerged branch
    # chore/land-slice3-remainder @ bcba50b and reported 34/35 requirements,
    # 63/64 scenarios, 0 CRITICAL, 8 WARNING and 11 SUGGESTION. Those counts
    # are stale in two ways: the findings were remediated, and the specs
    # gained three scenarios while that happened.
    verify_result_envelope:
      # The machine-readable gentle-ai.verify-result/v1 envelope is the first
      # non-empty content of verify-report.md and is what the native
      # dispatcher parses. Mirrored here for the archive record only; the
      # report is authoritative. Admission confirmed with
      # `gentle-ai sdd-verify-validate --requirements 35 --scenarios 67`.
      schema: gentle-ai.verify-result/v1
      evidence_revision: sha256:a85fada3d1fb9c5d1052d2a4180ddbef50c4ab6d84b7d2215f8c429ab130e6ad
      verdict: pass
      blockers: 0
      critical_findings: 0
      requirements: 35/35
      scenarios: 67/67
      test_command: uv run pytest
      test_exit_code: 0
      test_output_hash: sha256:3ed9c83a12d7a9945bc938c83632259dacefd2ca0e9f72dda448274e493e5941
      build_command: uv run mypy
      build_exit_code: 0
      build_output_hash: sha256:f948243de639409228dd4bee63b27f24b14f54c40abe7bc306836ead628b67b0
    measurement:
      requirements: >-
        35, counted with `grep -cE '^### Requirement:'` over the seven files
        under specs/ and summed: alert-cycle 4, alert-dedup 5, local-alert-cli
        3, repo-hygiene 5, risk-evaluation 7, source-outage-notices 4,
        weather-sources 7.
      scenarios: >-
        67, counted with `grep -cE '^#### Scenario:'` over the same seven files
        and summed: alert-cycle 8, alert-dedup 6, local-alert-cli 3,
        repo-hygiene 6, risk-evaluation 18, source-outage-notices 6,
        weather-sources 20. Up from 64 because the remediation added three
        scenarios to alert-cycle; no other file changed its counts.
      evidence_revision: >-
        sha256 of `git rev-parse HEAD` including its trailing newline, so the
        digest names the revision the evidence was measured at. Matches the
        owner's independently captured value byte for byte.
      output_hashes: >-
        sha256 of each command's combined stdout and stderr with trailing
        newlines stripped. build_output_hash is exactly reproducible and
        matches the owner's value. test_output_hash is NOT reproducible across
        runs: pytest's summary line ends in the wall-clock duration, so an
        identical all-green suite yields a different digest each time. The
        exact hashed bytes are printed verbatim in verify-report.md, and both
        digests were re-derived from those printed blocks after writing.
    gate: >-
      uv run pytest 557 passed / 15 deselected, exit 0; uv run mypy clean on 35
      source files, exit 0; uv run ruff check . clean, exit 0; uv run ruff
      format --check . 78 files, exit 0. The opt-in integration suite passed on
      the first attempt for the first time (10 passed, 5 skipped), which is what
      finding S9's remediation addressed. Live CLI run clean, exit 0, nothing
      transmitted, nothing written inside the repository, and the one hazard in
      force (a wind warning) correctly discarded with a stated reason.
    coverage: >-
      35 requirements and 67 scenarios traced across the seven spec files. 35 of
      35 requirements proven by a test that ran green in this run; 67 of 67
      scenarios have a covering test that ran green. 66 of those tests would
      fail if the behaviour broke; one asserts a proxy for its scenario's second
      clause (finding W-A). No scenario is uncovered — repo-hygiene "Grep check
      passes" is automated now and is no longer the manual exception it was on
      2026-09-06.
    findings:
      critical: 0
      warning: 1
      suggestion: 5
    strict_tdd_verification: >-
      Strict TDD Mode is active, so the report carries the module's sections.
      TDD compliance 6/6: apply-progress.md has three TDD Cycle Evidence tables
      and 34 of the 44 task ids appear in one; the 10 that do not are the
      tooling scaffold, the three verification gates, the Protocol-only ports
      module, the test-support fakes, the fixture capture, the local wiring, the
      manual live smoke and one REFACTOR task — none of them RED/GREEN work, and
      the wiring is covered by TestWiring anyway. Test layers: 539 unit, 4
      architecture, 14 hygiene, 15 opt-in live integration; 572 collected, 557
      run by default. No E2E layer and none expected — the CLI is the outermost
      boundary. Coverage skipped cleanly: pytest-cov is not a dependency, which
      is informational and not blocking. Assertion-quality audit: 0 CRITICAL and
      0 WARNING from the pattern scan — no tautologies, no assertion without a
      production call, no lone len()==0, no mock-heavy test (unittest.mock is
      used nowhere by design), all 14 lone `is not None` hits are narrowing
      guards followed by a value assertion, and all 32 empty-collection
      assertions have a companion non-empty test in the same class. The only
      assertion-strength problem is W-A, which no pattern scan could find and
      the mutation did.
    blocking: none
    key_findings:
      - >-
        W-A (WARNING) The alert-cycle scenario "A reason the body already states
        in its own sentence is not repeated" asserts
        body.count("no estuvo disponible") == 1, which is a wording check rather
        than the structural claim the scenario makes. Mutation-proven: with
        SenamhiUnavailableReason rendering a differently worded Motivos bullet,
