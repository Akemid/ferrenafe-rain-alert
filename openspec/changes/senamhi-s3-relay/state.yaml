resolved_decisions:
  - id: freshness-threshold
    decision: 3 hours from S3 LastModified; producer timestamp informational, skew over ~15 min flagged.
  - id: monitoring
    decision: >-
      CloudWatch alarm to the operator email after 2 consecutive relay-degraded
      cycles, counting STALE_RELAY, RELAY_MISSING and RELAY_UNREADABLE together
      in any mix (design D40). Resolved by the owner, 2026-10-02.
  - id: resident-message
    decision: Unchanged; relay distinction only in the operator notice.
  - id: producers
    decision: >-
      Single producer (Mac, launchd) now; always-on producer required before
      2026-12-01 and it MUST use IAM Roles Anywhere. Resolved by the owner,
      2026-10-02.
  - id: integrity
    decision: >-
      Accepted risk, credential-only integrity with single-key write, versioning,
      size cap, producer parse gate, VersionId in the operator notice and log,
      and CloudTrail write-only data events as the forensic record.
  - id: trigger
    decision: EventBridge schedule stays the heartbeat; S3-event trigger out of scope.
  - id: producer-credential
    decision: >-
      Design D36 - dedicated IAM user access key scoped to PutObject on the one
      relay key, in the macOS Keychain via credential_process, for the Mac
      phase; rotation and revocation in the runbook. Resolved by the owner,
      2026-10-02.
  - id: relay-unavailable-reasons
    decision: >-
      STALE_RELAY (age >= 3 h), RELAY_MISSING (NoSuchKey/404, needs
      s3:ListBucket), RELAY_UNREADABLE (access denied, throttling, other
      errors). Never a direct-scrape fallback. Proposal R7 corrected. Resolved
      by the owner, 2026-10-02.
  - id: stored-content
    decision: >-
      Gate-validated page text encoded UTF-8, Content-Type text/html;
      charset=utf-8, not SENAMHI's original bytes (design D37, proposal R9).
      Resolved by the owner, 2026-10-02.
  - id: write-audit
    decision: >-
      CloudTrail data events, write-only, scoped to the relay bucket, dedicated
      trail and log bucket in ScheduledCycleStack (design D46). Resolved by the
      owner, 2026-10-02.
  - id: object-key-and-metadata
    decision: Design D37 - contracts/senamhi-relay.json, key senamhi/lambayeque/latest.html.
  - id: size-cap
    decision: Design D37 - 4 MiB, enforced by producer and reader.
  - id: producer-schedule
    decision: >-
      Design D47 - launchd StartCalendarInterval {Minute: 0}, not
      StartInterval, because StartInterval misses firings during sleep while
      StartCalendarInterval coalesces them into one run on wake (man
      launchd.plist). Phase 0 amendment, 2026-10-02.
  - id: stack-placement
    decision: Design D41 - ScheduledCycleStack, bucket retained, relayEnabled context.

open_decisions: []

