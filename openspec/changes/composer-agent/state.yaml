resolved_decisions:
  - id: no-continuity-tool
    resolved: 2026-09-09
    decision: >-
      get_recent_alerts(n) from design 7.3 is dropped from this change and
      deferred to change 3. The alert store is a local JSON file until then and
      an agent on AgentCore cannot read the operator's disk.
  - id: no-warning-detail-tool
    resolved: 2026-09-09
    decision: >-
      get_warning_detail(warning_id) from design 7.3 is dropped permanently.
      A second scraping surface plus third-party page text entering the prompt
      is not worth it; the sanitized aviso title carries the context.
  - id: agent-has-no-tools
    resolved: 2026-09-09
    decision: >-
      Consequence of the two decisions above, consciously accepted. The agent
      is a single structured-output call with zero tools. Design option A (a
      direct model call with no agent framework) would technically suffice.
      Option B stands because the owner's learning goal is Strands plus
      AgentCore and the runtime, deployment and invocation path are still
      exercised. Not to be reopened.
  - id: agent-runs-only-after-authorization
    resolved: 2026-09-09
    decision: >-
      The agent is invoked only after the dedup policy authorizes the send.
      A deduplicated cycle must cost nothing; asserted as invoker call count 0.
  - id: strict-number-validation
    resolved: 2026-09-09
    decision: >-
      Any number in the body that is absent from the structured input
      invalidates the agent's message and the deterministic template is sent
      instead. Amends design 7.5 rule 4 from prevention to hard rejection.
  - id: structured-output-over-json-parsing
    resolved: 2026-09-09
    decision: >-
      agent.structured_output(PydanticModel, prompt) returns a validated
      Pydantic object and serves the design 7.4 output contract better than
      parsing free-form JSON. Verified against current documentation
      2026-09-09.
  - id: pydantic-boundary
    resolved: 2026-09-09
    decision: >-
      Pydantic must not enter the domain, and must not enter src/ at all.
      Design D1 keeps the core on frozen dataclasses for a small Lambda bundle.
      Pydantic and Strands live only in agent/, a separate deployment unit
      shipped to AgentCore rather than packaged into the Lambda. Enforced by
      the architecture test.

open_decisions:
  - id: number-definition
    owner: sdd-spec
    priority: highest
    detail: >-
      "A number in the body" is not yet concrete. Spanish decimal commas
      (12,4 vs 12.4), times rendered from the window (14:00), dates
      (12/03/2026), horizon constants (24 horas), digits inside the sanitized
      aviso title, digits in the operator checklist, and numbers written as
      words (ochenta milimetros) all collide with a naive digit-run scan. The
      spec must define the allowed set derived from MessageRequest and decide
      the word-number question. Default if unanswered: strict on digits with an
      explicit allowed set, silent on word-numbers, documented as a known gap.
  - id: validator-placement
    owner: sdd-design
    detail: >-
      The proposal places the validator in domain/ because it is a rule about
      what the system is willing to say and carries no LLM concern. Design may
      move it to application/.
  - id: cli-opt-in-flag
    owner: sdd-spec
    detail: >-
      The proposal adds an opt-in agent flag to the local CLI (default off) so
      the owner can see a real agent message without the default suite paying
      for one. If the owner prefers a separate script, local-alert-cli drops
      off the modified-capabilities list.
  - id: composer-timeout
    owner: sdd-design
    detail: >-
      Proposed ~10 s wall clock, single attempt, no retry, sized for a cold
      start because no warm reuse should be expected on a six-hourly cycle.
      The hard deadline is the requirement; the number is a design decision.
  - id: bedrock-model-id
    owner: sdd-apply
    detail: >-
      The exact Bedrock model id string for Claude Haiku 4.5 is resolved
      against current documentation at apply time, not guessed in planning.
  - id: runbook-location
    owner: sdd-tasks
    detail: >-
      The AgentCore CLI deploy runbook is assumed to go under docs/. This
      change did not touch docs/ during planning; the runbook lands in apply.

