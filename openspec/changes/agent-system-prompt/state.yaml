resolved_decisions:
  - id: quality-gate
    decision: >-
      At least 8/10 drafts accepted by the unchanged validator over 10 live
      invocations of the deployed runtime on an incident-like request, recorded
      in docs/evidence/. Owner, 2026-10-03.
  - id: dates
    decision: >-
      Window dates copied exactly as the data writes them (DD/MM/AAAA HH:MM);
      never reworded. Validator unchanged. Owner, 2026-10-03.
  - id: city
    decision: City must appear in the body, not only the title. Owner, 2026-10-03.
  - id: fence-contract-test
    decision: >-
      A contract test keeps the fence-marker format aligned between
      agent_prompt.py and the agent's system prompt without cross-imports.
      Owner, 2026-10-03.
  - id: validator-unchanged
    decision: Validator and template fallback are not changed or loosened.
  - id: deploy-order
    decision: >-
      Agent first (duplicated user-turn rules harmless), then the app change
      that trims the user turn. Rollback by redeploying the previous agent and
      reverting the app.

design_decisions:
  - id: prompt-wording-ownership
    resolution: D49 - owner owns wording, reviewed in PR diff, every change re-gated (D53).
  - id: system-prompt-module-location
    resolution: D48 - agent/prompts.py SYSTEM_PROMPT, passed via Agent(system_prompt=...).
  - id: contract-test-mechanism
    resolution: D51 - golden contracts/composer-fence.json asserted from both suites.
  - id: deploy-and-live-check-steps
    resolution: D52-D54 - scripts/agent_live_acceptance.py, agent first from branch, app after merge with build-lambda.sh.


resolved_owner_decisions_2026_10_03:
  - id: approve-system-prompt-wording
    decision: >-
      D49 approved, with one added sentence: checklist sentences keep their
      own wording, number words included. Owner, 2026-10-03.
  - id: launch-agent-from-unmerged-branch
    decision: >-
      agentcore launch from the PR branch only after that PR's fresh-context
      security and correctness reviews pass; then the 10-call gate, evidence
      committed to the same PR, merge, then the app deploy. Owner, 2026-10-03.
  - id: pin-prompt-key-in-contract
    decision: >-
      PROMPT_KEY ("prompt") is also pinned in contracts/composer-fence.json and
      asserted on both sides. Owner, 2026-10-03.

