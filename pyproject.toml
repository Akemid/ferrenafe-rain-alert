[project]
name = "alerta-lluvias-ferrenafe"
version = "0.1.0"
description = "Local rain-alert decision engine for Ferrenafe (SENAMHI + Open-Meteo, no cloud)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
]

[project.scripts]
rain-alert-cycle = "rain_alert.entrypoints.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rain_alert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: hits real network sources (opt-in)"]
# Repo root on sys.path so `tests/support/*` (recording spies shared across
# unit and application tests, design.md section 10) is importable as
# `tests.support.*`, matching the dotted references in design.md section 10.
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
# openspec/docs hold planning markdown with illustrative Python snippets in
# fenced code blocks; ruff formats embedded code in Markdown, which would
# rewrite planning artifacts this change must not touch (see design.md
# section 12: "No file is modified or deleted outside this change's own
# slices; openspec/ and docs/ are untouched").
extend-exclude = ["openspec", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
