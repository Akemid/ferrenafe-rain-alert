[project]
name = "alerta-lluvias-ferrenafe"
version = "0.1.0"
description = "Local rain-alert decision engine for Ferrenafe (SENAMHI + Open-Meteo, no cloud)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.98",
    # The `[crt]` extra is not optional here, despite reading like a
    # performance tweak. botocore's *login* credential provider refuses to
    # load without it:
    #
    #   MissingDependencyException: Using the login credential provider
    #   requires an additional dependency. You will need to pip install
    #   "botocore[crt]" before proceeding.
    #
    # `aws login` is this project's documented authentication (see CLAUDE.md),
    # so without this an operator running `rain-alert-cycle --composer agent`
    # cannot reach the runtime at all. Found at the first live invocation, not
    # by any test: every test injects its own client.
    #
    # The deployed Lambda (change 3) uses an IAM execution role and would not
    # need it. Carried anyway, because the failure lands on the operator who
    # followed this repository's own instructions.
    "botocore[crt]>=1.35.0",
    "httpx>=0.28.1",
]

[project.scripts]
rain-alert-cycle = "rain_alert.entrypoints.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rain_alert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = ["integration: hits real network sources (opt-in)"]
# No `pythonpath` entry: `tests/` and every sub-directory carry an
# `__init__.py`, so `tests.support.*` (the recording spies shared across unit
# and application tests, design.md section 10) resolves as a real dotted
# import with canonical module names, rather than through a `sys.path` knob.

[tool.ruff]
line-length = 120
target-version = "py312"
# openspec/docs hold planning markdown with illustrative Python snippets in
# fenced code blocks; ruff formats embedded code in Markdown, which would
# rewrite planning artifacts this change must not touch (see design.md
# section 12: "No file is modified or deleted outside this change's own
# slices; openspec/ and docs/ are untouched").
extend-exclude = ["openspec", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# boto3/botocore ship no inline types and no third-party stub package is
# pinned; the seam that touches them (`adapters/agentcore_invoker.py`)
# already types its own surface explicitly.
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "moto>=5.2.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
