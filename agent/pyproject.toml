[project]
# A second, separate uv project (design.md D22). It is not a package inside
# `src/rain_alert`, is not part of the `rain-alert` wheel, and is never on the
# change-3 Lambda's dependency graph: `strands-agents`, `bedrock-agentcore` and
# `pydantic` are deployed to AgentCore Runtime and nowhere else. The boundary is
# enforced in both directions by tests/architecture/test_layer_boundaries.py.
name = "rain-alert-composer-agent"
version = "0.1.0"
description = "AgentCore Runtime deployment unit: composes one community alert message from pre-digested data."
# Python 3.14, not the root project's 3.12. This unit is deployed to AgentCore
# Runtime rather than to the change-3 Lambda, so the two versions are
# independent — coupling them would buy nothing and cost the longer support
# window. AgentCore deprecates PYTHON_3_14 on 2030-06-30 and PYTHON_3_12 on
# 2028-10-31, and 3.14 is what `agentcore create` scaffolds by default.
# `agentcore.json → runtimeVersion` must stay in step with this line.
requires-python = ">=3.14,<3.15"
dependencies = [
    # Observability. Not needed for the agent to run, and that is exactly the
    # risk: without it the deployment is invisible. AgentCore's ADOT discovers
    # this package at startup and instruments Strands and the Bedrock calls on
    # its own, with no code change here — which is how tasks.md 3.5's
    # cold-start measurement becomes possible at all, and how a silently
    # degraded agent becomes visible rather than just fallen-back-from.
    "aws-opentelemetry-distro",
    "bedrock-agentcore>=1.23.0",
    # `[crt]` and `mcp` are both already present transitively; declared here to
    # match what `agentcore create` scaffolds, so this project reads the way a
    # generated one does. Versions are ours where ours are newer — following
    # the standard does not mean going backwards.
    "botocore[crt]>=1.35.0",
    "mcp~=2.1.0",
    "pydantic>=2.13.5",
    "strands-agents>=1.55.1",
]

[tool.uv]
# Not built into a wheel and not installed into its own environment. AgentCore
# packages the directory and runs `app.py` from it, so the modules are flat and
# importable by name rather than through an installed distribution.
package = false

[tool.pytest.ini_options]
# `--directory agent` is what makes this file the one pytest reads: rootdir is
# taken from the invocation directory, and the root project's own
# `testpaths = ["tests"]` is relative to the repository root, so `uv run pytest`
# there never reaches these tests. The command is
# `uv run --directory agent pytest`.
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
